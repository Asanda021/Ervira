name: Build Academy PDF catalogs

on:
  push:
    branches: [main]
    paths-ignore:
      - "catalog/pdfs/**"
      - ".github/workflows/build-catalog-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab arabic-reshaper python-bidi
      - name: Build PDFs
        run: python tools/build_catalog_pdfs.py
      - name: Commit generated PDFs
        run: |
          git config user.name "ERVIRA Bot"
          git config user.email "actions@github.com"
          git add catalog/pdfs/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m "P125: generate Academy PDF catalogs [skip ci]"
          git push

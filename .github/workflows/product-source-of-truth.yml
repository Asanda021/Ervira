name: ERVIRA Product Source-of-Truth Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  product-source-of-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate StructuralPro canonical contract
        run: node scripts/validate-structuralpro-source.mjs

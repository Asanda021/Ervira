name: Release readiness
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        shell: bash
        run: |
          test -f README.md
          test -f COMMERCE_ARCHITECTURE.md
          test -f pricing.html
          test -f checkout.html
          echo "Release metadata validated"
